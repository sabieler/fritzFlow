name: CI

# Prüft jeden Pull Request und jeden Push auf main: Formatierung, go vet, Tests, Builds.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache: false  # keine externen Abhängigkeiten

      - name: Formatierung (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Nicht formatiert (bitte 'gofmt -w .' ausführen):"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test -count=1 ./...

      - name: Build (alle Plattformen)
        run: |
          for t in windows/amd64 windows/arm64 darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 linux/arm; do
            CGO_ENABLED=0 GOOS="${t%/*}" GOARCH="${t#*/}" go build -o /dev/null . || exit 1
          done
