name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write     # Release anlegen
  id-token: write     # Sigstore-Signatur für den Build-Nachweis
  attestations: write # Build-Nachweis speichern

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache: false  # keine externen Abhängigkeiten, nichts zu cachen

      - name: Test und Build (alle Plattformen)
        run: VERSION="${GITHUB_REF_NAME}" ./scripts/build.sh

      # Signierter Build-Nachweis (Sigstore): belegt, dass jede Datei genau aus diesem
      # Commit per GitHub Actions gebaut wurde. Prüfen: gh attestation verify <datei> -R <owner>/<repo>
      # Für private Repos kostenpflichtig, daher nur bei öffentlichem Repo.
      - name: Build-Nachweis signieren
        if: startsWith(github.ref, 'refs/tags/') && !github.event.repository.private
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/fritzflow-*

      - name: GitHub-Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/fritzflow-* dist/SHA256SUMS \
            --title "fritzFlow $GITHUB_REF_NAME" \
            --notes "Programmdatei für dein System herunterladen und starten – welche Datei passt, steht in der README (Abschnitt Schnellstart). Prüfsummen in SHA256SUMS."
