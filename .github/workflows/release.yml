name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test und Build (alle Plattformen)
        run: VERSION="${GITHUB_REF_NAME}" ./scripts/build.sh

      - name: GitHub-Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "fritzFlow $GITHUB_REF_NAME" \
            --notes "Programmdatei für dein System herunterladen und starten – siehe README. Prüfsummen in SHA256SUMS."
